name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache pose model
        uses: actions/cache@v4
        with:
          path: models
          key: pose-landmarker-full-float16-v1
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -v
      - name: Demo smoke test on the sample clip
        run: python demo.py --input assets/sample_squat.webm --headless --max-frames 60
